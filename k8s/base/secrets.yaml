apiVersion: v1
kind: Secret
metadata:
  name: eis-secrets
  namespace: eis
  labels:
    app.kubernetes.io/name: eis
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # CRITICAL: ALL values below MUST be set before deployment via sealed secrets or external secrets operator.
  # Deploying with empty values will result in a non-functional or insecure application.
  JWT_SECRET: ""  # REQUIRED - Must be set before deployment
  CREDENTIAL_ENCRYPT_KEY: ""  # REQUIRED - Must be set before deployment
  LLM_API_KEY: ""  # REQUIRED - Must be set before deployment
  # Database credentials (if using external DB)
  # QDRANT_API_KEY: ""
  # FALKORDB_PASSWORD: ""

