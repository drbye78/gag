name: CD

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/eis-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Dev
        uses: azure/k8s-set-context@v1
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_DEV }}

      - name: Deploy kustomize
        run: |
          kubectl set image deployment/eis-api api=${{ needs.build.outputs.image-tag }} -n eis-dev
          kubectl rollout status deployment/eis-api -n eis-dev

  smoke-test-dev:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/k8s-set-context@v1
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_DEV }}

      - name: Wait for deployment and get service IP
        run: |
          # Wait for rollout to complete
          kubectl rollout status deployment/eis-api -n eis-dev --timeout=60s
          # Get the external IP of the service
          echo "SERVICE_IP=$(kubectl get svc eis-api -n eis-dev -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV
          echo "PORT=$(kubectl get svc eis-api -n eis-dev -o jsonpath='{.spec.ports[?(@.name=="http")].port}')" >> $GITHUB_ENV

      - name: Smoke test - Health endpoint
        run: |
          # Wait for service to be ready (up to 60s)
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${SERVICE_IP}:${PORT}/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Health check returned $HTTP_CODE, retrying..."
            sleep 5
          done
          echo "Health check failed after 60s"
          exit 1

      - name: Smoke test - Metrics endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${SERVICE_IP}:${PORT}/metrics 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Metrics check passed"
          else
            echo "Metrics check returned $HTTP_CODE"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Smoke test failed, rolling back deployment..."
          kubectl rollout undo deployment/eis-api -n eis-dev
          kubectl rollout status deployment/eis-api -n eis-dev

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        uses: azure/k8s-set-context@v1
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_PROD }}

      - name: Deploy kustomize
        run: |
          kubectl set image deployment/eis-api api=${{ needs.build.outputs.image-tag }} -n eis-prod
          kubectl rollout status deployment/eis-api -n eis-prod

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') }}

  smoke-test-prod:
    needs: [build, deploy-prod]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/k8s-set-context@v1
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_PROD }}

      - name: Wait for deployment and get service IP
        run: |
          # Wait for rollout to complete
          kubectl rollout status deployment/eis-api -n eis-prod --timeout=60s
          # Get the external IP of the service
          echo "SERVICE_IP=$(kubectl get svc eis-api -n eis-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV
          echo "PORT=$(kubectl get svc eis-api -n eis-prod -o jsonpath='{.spec.ports[?(@.name=="http")].port}')" >> $GITHUB_ENV

      - name: Smoke test - Health endpoint
        run: |
          # Wait for service to be ready (up to 60s)
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${SERVICE_IP}:${PORT}/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Health check returned $HTTP_CODE, retrying..."
            sleep 5
          done
          echo "Health check failed after 60s"
          exit 1

      - name: Smoke test - Metrics endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${SERVICE_IP}:${PORT}/metrics 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Metrics check passed"
          else
            echo "Metrics check returned $HTTP_CODE"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Smoke test failed, rolling back deployment..."
          kubectl rollout undo deployment/eis-api -n eis-prod
          kubectl rollout status deployment/eis-api -n eis-prod