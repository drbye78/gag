# Docker Compose for integration testing
# Usage: docker-compose -f docker-compose.test.yml up -d
# Then run: pytest tests/integration/ -v

services:
  qdrant-test:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6334:6333"
    networks:
      - eis-test-net
    restart: "no"

  falkordb-test:
    image: falkordb/falkordb:v4.18.0
    ports:
      - "7380:6379"
    networks:
      - eis-test-net
    restart: "no"

  redis-test:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    networks:
      - eis-test-net
    restart: "no"

networks:
  eis-test-net:
    driver: bridge
