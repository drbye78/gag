# GCP Architecture Patterns
patterns:
  - id: cloud-functions
    name: Cloud Functions Serverless
    domain: serverless
    triggers:
      - has_serverless
    components:
      - google_cloudfunctions_function
      - google_storage_bucket
      - google_pubsub_topic

  - id: cloud-run
    name: Cloud Run Microservice
    domain: microservices
    triggers:
      - has_container
    components:
      - google_cloud_run_service
      - google_container_registry
      - google_service_account

  - id: gke-service
    name: GKE Container Orchestration
    domain: microservices
    triggers:
      - has_container
      - has_kubernetes
    components:
      - google_container_cluster
      - google_container_node_pool
      - google_service_account

  - id: pubsub-event-driven
    name: Pub/Sub Event-Driven
    domain: event-driven
    triggers:
      - has_event_source
    components:
      - google_pubsub_topic
      - google_pubsub_subscription
      - google_cloudfunctions_function
