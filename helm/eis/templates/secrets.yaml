apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eis.fullname" . }}-secrets
  labels:
    {{- include "eis.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  CREDENTIAL_ENCRYPT_KEY: {{ .Values.secrets.credentialEncryptKey | b64enc | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | b64enc | quote }}