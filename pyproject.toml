[project]
name = "engineering-intelligence-system"
version = "4.2.0"
description = "Production-grade cognitive architecture for domain-specific reasoning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.7.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10.0",
    "markdown>=3.5.0",
    "python-magic>=0.4.27",
    "pyyaml>=6.0.0",
    "docling>=2.0.0",
    "pillow>=10.0.0",
    "sentence-transformers>=2.2.0",
    "llama-index>=0.10.0",
    "llama-index-embeddings-huggingface>=0.7.0",
    "redis>=5.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "langdetect>=1.0.9",
    "fastembed>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "bandit>=1.7.0",
]
qdrant = ["qdrant-client>=1.7.0"]
docs-parse = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10.0",
    "markdown>=3.5.0",
    "python-magic>=0.4.27",
]
embeddings = ["sentence-transformers>=2.2.0"]
prod = ["redis>=5.0.0"]
all = [
    "qdrant-client>=1.7.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10.0",
    "markdown>=3.5.0",
    "python-magic>=0.4.27",
    "sentence-transformers>=2.2.0",
    "redis>=5.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "langdetect>=1.0.9",
    "fastembed>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
